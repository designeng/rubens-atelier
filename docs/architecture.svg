<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 306" width="970" height="306" role="img" aria-labelledby="title desc">
  <title id="title">Task flow</title>
  <desc id="desc">POST /tasks enqueues a task in the Celery broker on Redis; a Celery worker runs it with the Claude Agent SDK and writes status to a task hash and agent events to a Redis Stream; GET /tasks/{id} reads the hash, GET /tasks/{id}/stream serves the events over SSE with replay.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .label { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #59636e; }
    .edge { font-size: 11px; fill: #59636e; letter-spacing: .02em; }
    .title { font-size: 12px; font-weight: 600; fill: #8a5a2b; letter-spacing: .12em; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .group { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .accent { fill: #f7efe4; stroke: #b07a43; stroke-width: 1.4; }
    .line { fill: none; stroke: #8c959f; stroke-width: 1.4; }
    .head { fill: #8c959f; }
    .dot { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .sub, .edge { fill: #9198a1; }
      .title { fill: #d9a86c; }
      .box { fill: #0d1117; stroke: #3d444d; }
      .group { fill: #151b23; stroke: #3d444d; }
      .accent { fill: #2a2016; stroke: #c48c52; }
      .line { stroke: #6e7681; }
      .head, .dot { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- clients -->
  <text class="title" x="20" y="32">CLIENT</text>
  <rect class="box" x="20" y="46" width="200" height="52" rx="10"/>
  <text class="mono" x="120" y="77" text-anchor="middle">POST /tasks</text>
  <rect class="box" x="20" y="136" width="200" height="52" rx="10"/>
  <text class="mono" x="120" y="167" text-anchor="middle">GET /tasks/{id}</text>
  <rect class="box" x="20" y="226" width="200" height="52" rx="10"/>
  <text class="mono" x="120" y="257" text-anchor="middle">GET …/stream</text>

  <!-- redis -->
  <rect class="group" x="320" y="14" width="240" height="282" rx="14"/>
  <text class="title" x="336" y="32">REDIS</text>
  <rect class="box" x="336" y="46" width="208" height="52" rx="10"/>
  <text class="label" x="352" y="68">Celery broker</text>
  <text class="sub" x="352" y="86">task queue</text>
  <rect class="box" x="336" y="136" width="208" height="52" rx="10"/>
  <text class="label" x="352" y="158">Task hash</text>
  <text class="sub" x="352" y="176">status · session_id · result · cost</text>
  <rect class="box" x="336" y="226" width="208" height="52" rx="10"/>
  <text class="label" x="352" y="248">Redis Stream</text>
  <text class="sub" x="352" y="266">agent events</text>

  <!-- worker and agent -->
  <text class="title" x="640" y="32">WORKER</text>
  <rect class="box" x="640" y="46" width="130" height="52" rx="10"/>
  <text class="label" x="705" y="77" text-anchor="middle">Celery worker</text>
  <rect class="accent" x="810" y="40" width="144" height="64" rx="12"/>
  <text class="label" x="882" y="68" text-anchor="middle">Claude Agent SDK</text>
  <text class="sub" x="882" y="87" text-anchor="middle">Claude Code</text>

  <!-- requests -->
  <path class="line" d="M220 72 H334" marker-end="url(#arrow)"/>
  <text class="edge" x="270" y="64" text-anchor="middle">enqueue</text>
  <path class="line" d="M544 72 H638" marker-end="url(#arrow)"/>
  <path class="line" d="M770 72 H808" marker-end="url(#arrow)"/>

  <!-- worker writes -->
  <path class="line" d="M705 98 V252 H546" marker-end="url(#arrow)"/>
  <path class="line" d="M705 162 H546" marker-end="url(#arrow)"/>
  <circle class="dot" cx="705" cy="162" r="3"/>
  <text class="edge" x="625" y="154" text-anchor="middle">update</text>
  <text class="edge" x="625" y="244" text-anchor="middle">append</text>

  <!-- reads -->
  <path class="line" d="M336 162 H222" marker-end="url(#arrow)"/>
  <text class="edge" x="270" y="154" text-anchor="middle">JSON</text>
  <path class="line" d="M336 252 H222" marker-end="url(#arrow)"/>
  <text class="edge" x="270" y="244" text-anchor="middle">SSE · replay</text>
</svg>
