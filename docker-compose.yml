x-app: &app
  build: .
  env_file: .env
  environment:
    HARNESS_REDIS_URL: redis://redis:6379/0
    HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@postgres:5432/harness
  depends_on:
    redis:
      condition: service_started
    # The schema is migrated once, before any service touches the database.
    migrate:
      condition: service_completed_successfully

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-off: alembic upgrade head (stamps a pre-Alembic database first), then exits.
  migrate:
    <<: *app
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports: ["8000:8000"]
    volumes: [workspaces:/workspaces:ro]  # the board's read-only git view

  worker:
    <<: *app
    # At least HARNESS_MAX_AGENTS, plus room for actions (push, PR).
    command: ["celery", "-A", "app.celery_app", "worker", "-l", "info", "--concurrency", "6"]
    volumes: [workspaces:/workspaces]
    # Warm shutdown waits for running agents; give them time before SIGKILL.
    stop_grace_period: 10m

  beat:
    <<: *app
    command: ["celery", "-A", "app.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]

volumes:
  redis-data:
  pg-data:
  workspaces:
