x-app: &app
  build: .
  env_file: .env
  environment:
    HARNESS_REDIS_URL: redis://redis:6379/0
    HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@postgres:5432/harness
  depends_on:
    redis:
      condition: service_started
    # The schema is migrated once, before any service touches the database.
    migrate:
      condition: service_completed_successfully

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Published for `make dev` on the host, on loopback only: Redis has no password, and whoever
    # reaches it can put tasks straight into the Celery queue.
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports: ["127.0.0.1:5432:5432"]  # loopback only: the password above is no secret
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-off: alembic upgrade head (stamps a pre-Alembic database first), then exits.
  migrate:
    <<: *app
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    # Reachable from other machines only with HARNESS_API_TOKEN set; without it the API refuses
    # every request that does not come from inside this container.
    ports: ["8000:8000"]
    volumes: [workspaces:/workspaces:ro]  # the board's read-only git view

  worker:
    <<: *app
    # At least HARNESS_MAX_AGENTS, plus room for actions (push, PR).
    command: ["celery", "-A", "app.celery_app", "worker", "-l", "info", "--concurrency", "6"]
    volumes: [workspaces:/workspaces]
    # The agent's Bash sandbox (bubblewrap) needs what Docker blocks by default, and without it Bash
    # fails (the sandbox is fail-closed). The profile is Docker's default (moby v27.5.1) plus one
    # last rule with the syscalls bubblewrap needs; systempaths=unconfined lets it mount a fresh
    # /proc, which seccomp=unconfined alone does not. On AppArmor hosts (Ubuntu) Docker's default
    # AppArmor profile may also block the mounts: then add "apparmor=unconfined".
    # The worker probes bwrap on start: it logs an error, /healthz reports "sandbox": false and the
    # board shows a warning.
    security_opt: ["seccomp=./docker/seccomp-worker.json", "systempaths=unconfined"]
    # Warm shutdown waits for running agents; give them time before SIGKILL.
    stop_grace_period: 10m

  beat:
    <<: *app
    command: ["celery", "-A", "app.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]

volumes:
  redis-data:
  pg-data:
  workspaces:
