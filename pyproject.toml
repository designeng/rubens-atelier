[project]
name = "agent-harness"
version = "0.1.0"
description = "HTTP harness for running Claude Code agents as long-running background tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.5",
    "claude-agent-sdk>=0.2.174",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.3",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=3.5.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis[lua]>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyright>=1.1.400",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 120
target-version = "py313"
# workspaces/ holds agents' clones; migrations/versions is generated by Alembic.
extend-exclude = ["workspaces", "web", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
# Only our tests: workspaces/ holds agents' clones of repos, possibly this one.
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
