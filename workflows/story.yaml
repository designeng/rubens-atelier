name: story
description: >-
  Plan one story, implement it, merge in the latest base branch, have it reviewed in a fresh
  session, open a PR, pass CI, wait for the merge.
initial: plan

states:
  plan:
    agent: planner
    disallowed_tools: [Write, Edit]
    verdicts: [ready, needs_clarification, too_big]
    resume: true
    max_visits: 3
    on_exhausted: needs_human
    next: {ready: implement, needs_clarification: clarify, too_big: needs_human, error: needs_human}

  clarify:
    human: The planner has questions (see the plan artifact). Answer them in the comment.
    options: [answered, abandon]
    next: {answered: plan, abandon: cancelled}

  implement:
    agent: implementer
    effort: medium
    verify: true
    resume: true
    max_visits: 4
    on_exhausted: needs_human
    next: {done: sync_base, error: needs_human}

  # Bring in what other stories merged meanwhile, so the reviewer sees the code as it will
  # land and the PR doesn't conflict. Conflicts go back to the implementer.
  sync_base:
    action: sync_base
    verdicts: [done, conflict]
    next: {done: review, conflict: implement, error: needs_human}

  review:
    agent: reviewer
    disallowed_tools: [Write, Edit]
    verdicts: [approved, changes_requested, needs_human]
    next: {approved: publish, changes_requested: implement, needs_human: needs_human, error: needs_human}

  publish:
    action: open_pr
    next: {done: ci, error: needs_human}

  ci:
    check: ci
    timeout_seconds: 3600
    grace_seconds: 300
    next: {passed: awaiting_merge, no_checks: awaiting_merge, failed: implement, timeout: needs_human, error: needs_human}

  awaiting_merge:
    human: >-
      The PR is open. Merge it, send it back with a comment, or update it when the base branch
      has moved on or GitHub reports conflicts.
    watch: merge  # answers `merged` / `abandon` by itself once GitHub reports the PR's fate
    options: [merged, update, rework, abandon]
    next: {merged: done, update: sync_base, rework: implement, abandon: cancelled}

  needs_human:
    human: The workflow is stuck (see the latest artifacts). Retry or replan with a comment, or abandon.
    options: [retry, replan, abandon]
    next: {retry: implement, replan: plan, abandon: cancelled}

  done: {terminal: succeeded}
  failed: {terminal: failed}
  cancelled: {terminal: cancelled}
